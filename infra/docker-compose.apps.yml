# =============================================================================
# Application services.
# Requires docker-compose.base.yml to be up (or compose both together via
# `tajo up`, which combines: base + apps + the dev/prod override).
#
# Images default to GHCR (ghcr.io/vsadtajo/<service>:latest). For local dev,
# the docker-compose.dev.yml override replaces `image:` with `build:` and
# enables hot-reload via bind mounts.
# =============================================================================

# -----------------------------------------------------------------------------
# Anchors — shared environment blocks. Use with `<<: *common-...`.
# Anything per-service (DB_HOST, DB_DATABASE, APP_NAME, APP_PORT) lives in
# the service's own `environment:` block.
# -----------------------------------------------------------------------------
x-common-db-env: &common-db-env
    DB_PORT: '5432'
    DB_USERNAME: ${POSTGRES_USER:-postgres}
    DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    DB_SYNCHRONIZE: 'false'
    DB_LOGGING: 'false'

x-common-infra-env: &common-infra-env
    NODE_ENV: ${NODE_ENV:-production}
    APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
    LOGS_API_URL: http://ms-logs-api:3004
    REDIS_HOST: infra-redis
    REDIS_PORT: '6379'
    REDIS_DEFAULT_TTL: ${REDIS_DEFAULT_TTL:-300}
    RABBITMQ_HOST: infra-rabbitmq
    RABBITMQ_PORT: '5672'
    RABBITMQ_USER: ${RABBITMQ_USER:-guest}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
    RABBITMQ_PREFETCH: ${RABBITMQ_PREFETCH:-10}
    RABBITMQ_RETRY_ATTEMPTS: ${RABBITMQ_RETRY_ATTEMPTS:-3}
    RABBITMQ_RETRY_DELAY: ${RABBITMQ_RETRY_DELAY:-5000}
    RABBITMQ_ENABLED: 'true'

x-app-defaults: &app-defaults
    restart: unless-stopped
    networks:
        - infra-network
    env_file:
        - ./.env

# Healthcheck for NestJS services. Uses Node 22's built-in fetch so no extra
# binaries are required in the image.
x-nest-healthcheck: &nest-healthcheck
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 45s

services:
    # ──────────────────────────────────────────────────────────────────────
    # API GATEWAY (no DB; pure proxy + RBAC cache)
    # ──────────────────────────────────────────────────────────────────────
    ms-gateway-api:
        <<: *app-defaults
        image: ${REGISTRY:-ghcr.io/vsadtajo}/ms-gateway-api:${TAG:?TAG must be set — bumped by CI in infra/version.env, or export TAG=... to override}
        container_name: ms-gateway-api
        environment:
            <<: *common-infra-env
            APP_NAME: ms-gateway-api
            APP_PORT: '3000'
            AUTH_API_URL: http://ms-authentication-api:3002
            USER_API_URL: http://ms-user-api:3001
            SFTP_API_URL: http://ms-sftp-api:3003
            PREDICTIONS_API_URL: http://ms-predictions-api:3007
            HYDRO_API_URL: http://ms-hydro-api:3006
            MODEL_API_URL: http://ms-model-api:3008
            NOTIFICATIONS_API_URL: http://ms-notifications-api:3009
            METEO_API_URL: http://ms-meteo-api:3010
            RBAC_BYPASS_ROLES: ${RBAC_BYPASS_ROLES:-admin}
            REDIS_PERMISSION_TTL: ${REDIS_PERMISSION_TTL:-3600}
        ports:
            - '3000:3000'
        depends_on:
            infra-redis:
                condition: service_healthy
            infra-rabbitmq:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'node -e "fetch(''http://localhost:3000/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
            <<: *nest-healthcheck

    # ──────────────────────────────────────────────────────────────────────
    # USERS (RBAC core)
    # ──────────────────────────────────────────────────────────────────────
    ms-user-api:
        <<: *app-defaults
        image: ${REGISTRY:-ghcr.io/vsadtajo}/ms-user-api:${TAG:?TAG must be set — bumped by CI in infra/version.env, or export TAG=... to override}
        container_name: ms-user-api
        environment:
            <<: [*common-db-env, *common-infra-env]
            APP_NAME: ms-user-api
            APP_PORT: '3001'
            DB_HOST: infra-db-user
            DB_DATABASE: ${DB_USER_DATABASE:-user_db}
            ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
        expose:
            - '3001'
        depends_on:
            infra-db-user:
                condition: service_healthy
            infra-redis:
                condition: service_healthy
            infra-rabbitmq:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'node -e "fetch(''http://localhost:3001/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
            <<: *nest-healthcheck

    # ──────────────────────────────────────────────────────────────────────
    # AUTHENTICATION (stateless; uses Redis for JWT/permission cache)
    # ──────────────────────────────────────────────────────────────────────
    ms-authentication-api:
        <<: *app-defaults
        image: ${REGISTRY:-ghcr.io/vsadtajo}/ms-authentication-api:${TAG:?TAG must be set — bumped by CI in infra/version.env, or export TAG=... to override}
        container_name: ms-authentication-api
        environment:
            <<: *common-infra-env
            APP_NAME: ms-authentication-api
            APP_PORT: '3002'
            USER_API_URL: http://ms-user-api:3001
            JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
            JWT_EXPIRATION: ${JWT_EXPIRATION:-1h}
            JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
            JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-15d}
        expose:
            - '3002'
        depends_on:
            infra-redis:
                condition: service_healthy
            ms-user-api:
                condition: service_started
        healthcheck:
            test: ['CMD-SHELL', 'node -e "fetch(''http://localhost:3002/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
            <<: *nest-healthcheck

    # ──────────────────────────────────────────────────────────────────────
    # SFTP (file transfer; the Mapping Engine UI runs as the separate
    # sftp-frontend service below)
    # ──────────────────────────────────────────────────────────────────────
    ms-sftp-api:
        <<: *app-defaults
        image: ${REGISTRY:-ghcr.io/vsadtajo}/ms-sftp-api:${TAG:?TAG must be set — bumped by CI in infra/version.env, or export TAG=... to override}
        container_name: ms-sftp-api
        environment:
            <<: [*common-db-env, *common-infra-env]
            APP_NAME: ms-sftp-api
            APP_PORT: '3003'
            DB_HOST: infra-db-sftp
            DB_DATABASE: ${DB_SFTP_DATABASE:-sftp_db}
            APP_URL: 0.0.0.0
            DB_SSL: 'false'
            X_API_KEY: ${X_API_KEY:-}
            AUTH_API_URL: http://ms-authentication-api:3002
            SFTP_SERVER_ENABLED: 'true'
            SFTP_SERVER_PORT: ${SFTP_PORT:-8212}
            SFTP_SERVER_HOST_KEY_PATH: /data/sftp/host_key
            SFTP_SERVER_AUTO_GENERATE_HOST_KEY: 'true'
            SFTP_SERVER_MAX_CONNECTIONS: '10'
            SFTP_CONNECTION_TIMEOUT: '10000'
            SFTP_OPERATION_TIMEOUT: '60000'
            STORAGE_BASE_PATH: /data/files
            STORAGE_MAX_FILE_SIZE: '524288000'
        ports:
            - '${SFTP_PORT:-8212}:${SFTP_PORT:-8212}'
        expose:
            - '3003'
        volumes:
            - sftp-files:/data/files
            - sftp-keys:/data/sftp
        depends_on:
            infra-db-sftp:
                condition: service_healthy
            infra-redis:
                condition: service_healthy
            infra-rabbitmq:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'node -e "fetch(''http://localhost:3003/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
            <<: *nest-healthcheck

    # ──────────────────────────────────────────────────────────────────────
    # SFTP FRONTEND (Mapping Engine UI — React SPA served by nginx, own image.
    # API URLs are baked at build time, so it needs its own GHCR image.)
    # ──────────────────────────────────────────────────────────────────────
    sftp-frontend:
        <<: *app-defaults
        image: ${REGISTRY:-ghcr.io/vsadtajo}/sftp-frontend:${TAG:?TAG must be set — bumped by CI in infra/version.env, or export TAG=... to override}
        container_name: sftp-frontend
        # Runtime config: the image ships with a URL placeholder; the entrypoint
        # substitutes AUTH_API_URL into the built assets at start, so ONE image
        # works on any host. Points at the public gateway URL from the .env.
        environment:
            AUTH_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
        ports:
            - '5174:80'
        depends_on:
            ms-sftp-api:
                condition: service_started

    # ──────────────────────────────────────────────────────────────────────
    # LOGS (Express + Mongo; centralized log ingest for the platform)
    # ──────────────────────────────────────────────────────────────────────
    ms-logs-api:
        <<: *app-defaults
        image: ${REGISTRY:-ghcr.io/vsadtajo}/ms-logs-api:${TAG:?TAG must be set — bumped by CI in infra/version.env, or export TAG=... to override}
        container_name: ms-logs-api
        environment:
            NODE_ENV: ${NODE_ENV:-production}
            PORT: '3004'
            MONGO_URI: ${MONGO_URI}
            FRONTEND_URL: ${PUBLIC_API_URL:-http://localhost:3000}
        volumes:
            - logs-files-results:/app/dist/files_results
        ports:
            - '3004:3004'
        depends_on:
            infra-mongo-logs:
                condition: service_healthy

    ms-logs-ui:
        <<: *app-defaults
        image: ${REGISTRY:-ghcr.io/vsadtajo}/ms-logs-ui:${TAG:?TAG must be set — bumped by CI in infra/version.env, or export TAG=... to override}
        container_name: ms-logs-ui
        # Runtime config: the entrypoint substitutes these into the built assets
        # at start, so ONE image works on any host (see ui/docker-entrypoint.sh).
        environment:
            API_URL: ${PUBLIC_LOGS_API_URL:-http://localhost:3004}
            GATEWAY_URL: ${PUBLIC_API_URL:-http://localhost:3000}
            SCHEDULER_URL: ${PUBLIC_SCHEDULER_URL:-http://localhost:3000}
            PREDICTIONS_URL: ${PUBLIC_PREDICTIONS_URL:-http://localhost:3000}
        ports:
            - '3005:80'
        depends_on:
            ms-logs-api:
                condition: service_started

    # ──────────────────────────────────────────────────────────────────────
    # HYDRO
    # ──────────────────────────────────────────────────────────────────────
    ms-hydro-api:
        <<: *app-defaults
        image: ${REGISTRY:-ghcr.io/vsadtajo}/ms-hydro-api:${TAG:?TAG must be set — bumped by CI in infra/version.env, or export TAG=... to override}
        container_name: ms-hydro-api
        environment:
            <<: [*common-db-env, *common-infra-env]
            APP_NAME: ms-hydro-api
            APP_PORT: '3006'
            DB_HOST: infra-db-hydro
            DB_DATABASE: ${DB_HYDRO_DATABASE:-hydro_db}
            GEOSERVER_DB_HOST: infra-db-geoserver
            GEOSERVER_DB_PORT: '5432'
            GEOSERVER_DB_USERNAME: ${POSTGRES_USER:-postgres}
            GEOSERVER_DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
            GEOSERVER_DB_DATABASE: ${DB_GEOSERVER_DATABASE:-geoserver_db}
            APP_URL: 0.0.0.0
            DB_SSL: 'false'
            X_API_KEY: ${X_API_KEY:-}
        expose:
            - '3006'
        depends_on:
            infra-db-hydro:
                condition: service_healthy
            infra-redis:
                condition: service_healthy
            infra-rabbitmq:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'node -e "fetch(''http://localhost:3006/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
            <<: *nest-healthcheck

    # ──────────────────────────────────────────────────────────────────────
    # PREDICTIONS
    # ──────────────────────────────────────────────────────────────────────
    ms-predictions-api:
        <<: *app-defaults
        image: ${REGISTRY:-ghcr.io/vsadtajo}/ms-predictions-api:${TAG:?TAG must be set — bumped by CI in infra/version.env, or export TAG=... to override}
        container_name: ms-predictions-api
        environment:
            <<: [*common-db-env, *common-infra-env]
            APP_NAME: ms-predictions-api
            APP_PORT: '3007'
            DB_HOST: infra-db-predictions
            DB_DATABASE: ${DB_PREDICTIONS_DATABASE:-predictions_db}
            HYDRO_API_BASE_URL: http://ms-hydro-api:3006
            STATION_THRESHOLD_CACHE_TTL: ${STATION_THRESHOLD_CACHE_TTL:-300}
            # Header identifiers of the manual-simulation input file, as Idrica's
            # FEWS import maps the series (endpoints_FEWS_TagusFlowCast.xlsx).
            MANUAL_SIMULATION_MODULE_INSTANCE_ID: ${MANUAL_SIMULATION_MODULE_INSTANCE_ID:-ImportAPI_Q_mod}
            MANUAL_SIMULATION_PARAMETER_ID: ${MANUAL_SIMULATION_PARAMETER_ID:-Q.salida.forecast.web}
        expose:
            - '3007'
        depends_on:
            infra-db-predictions:
                condition: service_healthy
            infra-redis:
                condition: service_healthy
            infra-rabbitmq:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'node -e "fetch(''http://localhost:3007/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
            <<: *nest-healthcheck

    # ──────────────────────────────────────────────────────────────────────
    # MODEL
    # ──────────────────────────────────────────────────────────────────────
    ms-model-api:
        <<: *app-defaults
        image: ${REGISTRY:-ghcr.io/vsadtajo}/ms-model-api:${TAG:?TAG must be set — bumped by CI in infra/version.env, or export TAG=... to override}
        container_name: ms-model-api
        environment:
            <<: [*common-db-env, *common-infra-env]
            APP_NAME: ms-model-api
            APP_PORT: '3008'
            DB_HOST: infra-db-model
            DB_DATABASE: ${DB_MODEL_DATABASE:-model_db}
            SFTP_API_BASE_URL: http://ms-sftp-api:3003
            USE_CALCULATOR_PIPELINE: ${USE_CALCULATOR_PIPELINE:-true}
            # Observed reservoir volume (v.obs) that the calculator needs as the
            # balance's initial volume. Kept in its own folder: the CSV_FILE
            # provider moves tajo/Tagus_FlowCast.csv to historial/ once ingested,
            # which would race this lookup.
            VOBS_CSV_SFTP_PATH: ${VOBS_CSV_SFTP_PATH:-tajo/wiski/Tagus_FlowCast.csv}
            VOBS_CSV_TIMEZONE: ${VOBS_CSV_TIMEZONE:-Europe/Madrid}
            # WISKI REST (observed data). Their host only resolves inside the CH
            # Tajo network, so this stays empty until that access exists: the
            # WISKI_API provider then fails with the reason instead of a DNS error.
            VOBS_SOURCE: ${VOBS_SOURCE:-SFTP_CSV}
            WISKI_API_BASE_URL: ${WISKI_API_BASE_URL:-}
            WISKI_API_PATH: ${WISKI_API_PATH:-/wiski/tagus_flowcast_observado/}
            WISKI_API_TIMEZONE: ${WISKI_API_TIMEZONE:-Europe/Madrid}
            WISKI_API_REQUEST_TIMEOUT_MS: ${WISKI_API_REQUEST_TIMEOUT_MS:-120000}
            WISKI_API_MAX_RESPONSE_BYTES: ${WISKI_API_MAX_RESPONSE_BYTES:-52428800}
            # FEWS PI REST (direct model flow: modelSource=FEWS_API, and the
            # FEWS_API data providers). Values from Idrica's endpoint sheet for
            # the CH Tajo instance; the host only resolves inside their network.
            FEWS_API_BASE_URL: ${FEWS_API_BASE_URL:-http://cpdfews2.saihchtajo.es:8080/FewsWebServices}
            FEWS_API_SERVICE_PATH: ${FEWS_API_SERVICE_PATH:-/rest/fewspiservice/v1}
            FEWS_WORKFLOW_ID: ${FEWS_WORKFLOW_ID:-ForecastMIKE11_mod}
            FEWS_FILTER_ID: ${FEWS_FILTER_ID:-Tajo_Forecasts_mods}
            FEWS_API_USERNAME: ${FEWS_API_USERNAME:-}
            FEWS_API_PASSWORD: ${FEWS_API_PASSWORD:-}
            FEWS_RUN_USER_ID: ${FEWS_RUN_USER_ID:-fews}
            FEWS_RUN_OPTION: ${FEWS_RUN_OPTION:-alloneatatime}
            FEWS_RUN_START_OFFSET_MINUTES: ${FEWS_RUN_START_OFFSET_MINUTES:-60}
            FEWS_RUN_HORIZON_DAYS: ${FEWS_RUN_HORIZON_DAYS:-3}
            # The whole basin takes Idrica 10-15 minutes; 30 minutes leaves room.
            FEWS_TASK_TIMEOUT_MS: ${FEWS_TASK_TIMEOUT_MS:-1800000}
            FEWS_TASK_POLL_INTERVAL_MS: ${FEWS_TASK_POLL_INTERVAL_MS:-15000}
            FEWS_REQUEST_TIMEOUT_MS: ${FEWS_REQUEST_TIMEOUT_MS:-120000}
        expose:
            - '3008'
        depends_on:
            infra-db-model:
                condition: service_healthy
            infra-redis:
                condition: service_healthy
            infra-rabbitmq:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'node -e "fetch(''http://localhost:3008/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
            <<: *nest-healthcheck

    # ──────────────────────────────────────────────────────────────────────
    # NOTIFICATIONS
    # ──────────────────────────────────────────────────────────────────────
    ms-notifications-api:
        <<: *app-defaults
        image: ${REGISTRY:-ghcr.io/vsadtajo}/ms-notifications-api:${TAG:?TAG must be set — bumped by CI in infra/version.env, or export TAG=... to override}
        container_name: ms-notifications-api
        environment:
            <<: [*common-db-env, *common-infra-env]
            APP_NAME: ms-notifications-api
            APP_PORT: '3009'
            DB_HOST: infra-db-notifications
            DB_DATABASE: ${DB_NOTIFICATIONS_DATABASE:-notifications_db}
        expose:
            - '3009'
        depends_on:
            infra-db-notifications:
                condition: service_healthy
            infra-redis:
                condition: service_healthy
            infra-rabbitmq:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'node -e "fetch(''http://localhost:3009/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
            <<: *nest-healthcheck

    # ──────────────────────────────────────────────────────────────────────
    # METEO (PostGIS — spatial data; uses GDAL CLI internally)
    # ──────────────────────────────────────────────────────────────────────
    ms-meteo-api:
        <<: *app-defaults
        image: ${REGISTRY:-ghcr.io/vsadtajo}/ms-meteo-api:${TAG:?TAG must be set — bumped by CI in infra/version.env, or export TAG=... to override}
        container_name: ms-meteo-api
        environment:
            <<: [*common-db-env, *common-infra-env]
            APP_NAME: ms-meteo-api
            APP_PORT: '3010'
            DB_HOST: infra-db-meteo
            DB_DATABASE: ${DB_METEO_DATABASE:-meteo_db}
            GEOSERVER_URL: http://geoserver:8080/geoserver
            GEOSERVER_USER: ${GEOSERVER_ADMIN_USER:-admin}
            GEOSERVER_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
            GEOSERVER_WORKSPACE: ${GEOSERVER_WORKSPACE:-Tajo}
            AEMET_API_KEY: ${AEMET_API_KEY:-}
            AEMET_BASE_URL: ${AEMET_BASE_URL:-https://opendata.aemet.es/opendata}
            AEMET_DEFAULT_AREA: ${AEMET_DEFAULT_AREA:-esp}
            METEO_BASE_PATH: ${METEO_BASE_PATH:-tajo/METEO}
            METEO_GEOTIFF_DIR: ${METEO_GEOTIFF_DIR:-/opt/datasets/meteo}
            METEO_SYNC_CRON: ${METEO_SYNC_CRON:-0 */3 * * *}
            METEO_RETENTION_CRON: ${METEO_RETENTION_CRON:-0 3 * * *}
            METEO_RETENTION_DAYS: ${METEO_RETENTION_DAYS:-7}
            METEO_RETENTION_MODE: ${METEO_RETENTION_MODE:-today}
            SFTP_API_INTERNAL_CALLER: ms-meteo-api
        expose:
            - '3010'
        depends_on:
            infra-db-meteo:
                condition: service_healthy
            infra-redis:
                condition: service_healthy
            infra-rabbitmq:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'node -e "fetch(''http://localhost:3010/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
            <<: *nest-healthcheck

    # ──────────────────────────────────────────────────────────────────────
    # CALCULATOR (Python/FastAPI — event-driven volume-balance calc; no DB,
    # consumes/publishes via RabbitMQ. Python image, so the healthcheck can't
    # use node — it probes /health with urllib instead.)
    # ──────────────────────────────────────────────────────────────────────
    ms-calculator-api:
        <<: *app-defaults
        image: ${REGISTRY:-ghcr.io/vsadtajo}/ms-calculator-api:${TAG:?TAG must be set — bumped by CI in infra/version.env, or export TAG=... to override}
        container_name: ms-calculator-api
        environment:
            <<: *common-infra-env
            APP_NAME: ms-calculator-api
            APP_PORT: '3011'
            X_API_KEY: ${X_API_KEY:?X_API_KEY is required}
        ports:
            - '3011:3011'
        depends_on:
            infra-rabbitmq:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(''http://localhost:3011/health'').status==200 else 1)"']
            <<: *nest-healthcheck

    # ──────────────────────────────────────────────────────────────────────
    # FRONTEND (Vue 3 — served by nginx, API URL baked at build time)
    # ──────────────────────────────────────────────────────────────────────
    vsad-tajo-frontend:
        <<: *app-defaults
        image: ${REGISTRY:-ghcr.io/vsadtajo}/vsad-tajo-frontend:${TAG:?TAG must be set — bumped by CI in infra/version.env, or export TAG=... to override}
        container_name: vsad-tajo-frontend
        # Runtime config: the entrypoint substitutes these into the built assets
        # at start, so ONE image works on any host (see the frontend's
        # docker-entrypoint.sh).
        environment:
            API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
            GEOSERVER_URL: ${PUBLIC_GEOSERVER_URL:-http://localhost:8085/geoserver}
        ports:
            - '8080:80'
        depends_on:
            ms-gateway-api:
                condition: service_started

    # ──────────────────────────────────────────────────────────────────────
    # GEOSERVER (raster/vector map server)
    # ──────────────────────────────────────────────────────────────────────
    geoserver:
        image: docker.osgeo.org/geoserver:2.24.2
        container_name: geoserver
        restart: unless-stopped
        environment:
            GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
            GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
            INITIAL_MEMORY: ${GEOSERVER_INITIAL_MEMORY:-512M}
            MAXIMUM_MEMORY: ${GEOSERVER_MAXIMUM_MEMORY:-2G}
            INSTALL_EXTENSIONS: 'false'
            CORS_ENABLED: 'true'
            CORS_ALLOWED_ORIGINS: '*'
        volumes:
            - geoserver-data:/opt/geoserver_data
        ports:
            - '8085:8080'
        depends_on:
            infra-db-geoserver:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'curl -sf http://localhost:8080/geoserver/web/ -o /dev/null || exit 1']
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 90s
        networks:
            - infra-network

volumes:
    sftp-files:
    sftp-keys:
    logs-files-results:
    geoserver-data:

networks:
    infra-network:
        external: true
        name: infra-network
