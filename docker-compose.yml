services:
    app:
        container_name: ms-user-api
        image: ms-user-api-dev
        restart: unless-stopped
        build:
            context: .
            dockerfile: Dockerfile
            target: dev
        volumes:
            - .:/app
            - /app/node_modules
        env_file:
            - .env
        environment:
            - NODE_ENV=local
            - DB_HOST=ms-user-db
            - DB_PORT=5432
            - DB_USERNAME=${POSTGRES_USER}
            - DB_PASSWORD=${POSTGRES_PASSWORD}
            - DB_DATABASE=${POSTGRES_DB}
            - REDIS_HOST=ms-user-redis
            - REDIS_PORT=6379
            - RABBITMQ_ENABLED=true
            - RABBITMQ_HOST=ms-user-rabbitmq
            - RABBITMQ_PORT=5672
            - RABBITMQ_USER=guest
            - RABBITMQ_PASSWORD=guest
        networks:
            - app-network
            - infra-network
        # comment for security reasons
        # ports:
        #     - '3001:3001'
        expose:
            - '3001'
        depends_on:
            database:
                condition: service_healthy
        command: sh -c "npm run migration:run && npm run start:dev"

    database:
        container_name: ms-user-db
        image: postgres:16.4-alpine
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./docker/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        networks:
            - app-network
        ports:
            - '5433:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
            interval: 10s
            timeout: 5s
            retries: 5

networks:
    app-network:
    infra-network:
        external: true
        name: infra-network

volumes:
    postgres-data:
