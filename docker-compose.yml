services:
    app:
        container_name: ms-sftp-api
        image: ms-sftp-api-dev
        restart: unless-stopped
        build:
            context: .
            dockerfile: Dockerfile
            target: dev
        volumes:
            - .:/app
            - /app/node_modules
            - file-storage:/data/files
            - sftp-keys:/data/sftp
        env_file:
            - .env
        environment:
            - NODE_ENV=local
            - DB_HOST=ms-sftp-db
            - DB_PORT=5432
            - DB_USERNAME=${POSTGRES_USER}
            - DB_PASSWORD=${POSTGRES_PASSWORD}
            - DB_DATABASE=${POSTGRES_DB}
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - RABBITMQ_ENABLED=false
            - RABBITMQ_HOST=ms-sftp-rabbitmq
            - RABBITMQ_PORT=5672
            - RABBITMQ_USER=guest
            - RABBITMQ_PASSWORD=guest
        networks:
            - app-network
            - infra-network
        ports:
            #  3003 is the port for the API, commented only use de internal network
            # - '3003:3003'
            - '8212:8212'
        depends_on:
            database:
                condition: service_healthy
        command: sh -c "npm run migration:run && npm run start:dev"

    frontend:
        container_name: ms-sftp-frontend
        image: ms-sftp-frontend-dev
        restart: unless-stopped
        build:
            context: ./frontend
            dockerfile: Dockerfile
            target: ${FRONTEND_TARGET:-dev}
        volumes:
            - ./frontend:/app
            - /app/node_modules
        environment:
            - VITE_API_URL=http://ms-sftp-api:3003
        networks:
            - app-network
        ports:
            - '5173:5173'
        depends_on:
            - app

    database:
        container_name: ms-sftp-db
        image: postgres:16.4-alpine
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./docker/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        networks:
            - app-network
        ports:
            - '5435:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
            interval: 10s
            timeout: 5s
            retries: 5

networks:
    app-network:
    infra-network:
        external: true
        name: infra-network

volumes:
    postgres-data:
    file-storage:
    sftp-keys:
