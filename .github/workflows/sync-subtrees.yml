name: Sync Subtrees

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      any: ${{ steps.changes.outputs.any }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: changes
        run: |
          ALL_SERVICES=(
            ms-gateway-api
            ms-user-api
            ms-authentication-api
            ms-sftp-api
            ms-logs-api
            ms-hydro-api
            ms-predictions-api
            ms-model-api
            ms-notifications-api
            ms-meteo-api
            vsad-tajo-frontend
            tajo-toolkit
          )

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANGED=("${ALL_SERVICES[@]}")
          else
            CHANGED=()
            for svc in "${ALL_SERVICES[@]}"; do
              if git diff --name-only HEAD~1 HEAD | grep -q "^${svc}/"; then
                CHANGED+=("$svc")
              fi
            done
          fi

          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "matrix={\"service\":[]}" >> "$GITHUB_OUTPUT"
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '%s\n' "${CHANGED[@]}" | jq -R . | jq -sc '{service: .}')
            echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Detected: ${CHANGED[*]}"

  sync:
    needs: detect-changes
    if: needs.detect-changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install splitsh-lite
        run: |
          curl -fsSL https://github.com/splitsh/lite/releases/download/v1.0.1/lite_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/splitsh-lite
          splitsh-lite --version

      - name: Push ${{ matrix.service }} to standalone repo
        run: |
          set -e
          SERVICE="${{ matrix.service }}"
          TARGET_BRANCH="main"

          echo "Syncing $SERVICE to $TARGET_BRANCH"

          # splitsh-lite handles subtrees added with --squash (git subtree split does not)
          SHA=$(splitsh-lite --prefix="$SERVICE")
          echo "Split SHA: $SHA"

          git remote add target "https://x-access-token:${{ secrets.SUBTREE_PUSH_TOKEN }}@github.com/VSADTajo/${SERVICE}.git"
          git push target "${SHA}:refs/heads/${TARGET_BRANCH}" --force
