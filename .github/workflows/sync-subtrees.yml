name: Sync to standalone repos

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    sync:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                service:
                    - ms-gateway-api
                    - ms-user-api
                    - ms-authentication-api
                    - ms-sftp-api
                    - ms-logs-api
                    - ms-hydro-api
                    - ms-predictions-api
                    - ms-model-api
                    - ms-notifications-api
                    - ms-meteo-api
                    - vsad-tajo-frontend
                    - tajo-toolkit
        steps:
            - name: Checkout full history
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Detect changes for ${{ matrix.service }}
              id: changed
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                      echo "yes=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  BEFORE="${{ github.event.before }}"
                  AFTER="${{ github.sha }}"
                  if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                      echo "yes=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  if git diff --name-only "$BEFORE" "$AFTER" | grep -q "^${{ matrix.service }}/"; then
                      echo "yes=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "yes=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Push ${{ matrix.service }} to standalone repo
              if: steps.changed.outputs.yes == 'true'
              run: |
                  set -e
                  git remote add target "https://x-access-token:${{ secrets.SUBTREE_PUSH_TOKEN }}@github.com/VSADTajo/${{ matrix.service }}.git"
                  git subtree split --prefix="${{ matrix.service }}" -b "split-${{ matrix.service }}"
                  git push target "split-${{ matrix.service }}:main" --force
