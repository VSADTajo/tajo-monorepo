name: Deploy to VM

# Automated deploy — the GitHub Actions replacement for the Jenkins deploy stage.
# After images are built & pushed to GHCR, this SSHes into the VM and recreates
# the affected services with the new images (verbatim config, auto-rollback).
#
# Runtime secrets live on the VM (in the running containers); this workflow only
# needs SSH access + the image tag. App/DB secrets are NEVER passed here.
#
# Requires (Environment: production):
#   secrets.DEPLOY_SSH_KEY   — private key whose public key is in the VM's authorized_keys
#   secrets.DEPLOY_HOST      — VM host/IP (e.g. 65.21.97.113)
#   secrets.DEPLOY_USER      — SSH user (e.g. root)

on:
  # TEMP (remove before merge): lets a push to this branch run deploy.yml in
  # dry-run mode to validate the GitHub Actions -> VM path end to end.
  push:
    branches: [feature/unified-docker-stack]
  workflow_run:
    workflows: ['Build & Push images to GHCR']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to deploy (space-separated, or "all")'
        required: false
        default: 'all'
      tag:
        description: 'Image tag to deploy'
        required: false
        default: 'latest'

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    # For workflow_run, only proceed if the build actually succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy redeploy script to VM
        run: |
          scp -i ~/.ssh/id_deploy infra/redeploy.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/cutover/redeploy.sh"

      - name: Redeploy services
        env:
          SERVICES: ${{ github.event.inputs.services || 'all' }}
          TAG: ${{ github.event.inputs.tag || 'latest' }}
        run: |
          # TEMP (remove before merge): DRY_RUN forces a safe validation run —
          # it pulls images and rebuilds config but never touches a container.
          ssh -i ~/.ssh/id_deploy \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "DRY_RUN=1 TAG='feature-unified-docker-stack' bash /opt/cutover/redeploy.sh 'all'"
