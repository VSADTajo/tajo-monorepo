name: Build & Push images to GHCR

# Builds every service in the monorepo and pushes to ghcr.io/<owner>/<service>.
#
# Triggers:
#   - push to main             → tag :latest, :main, :sha-<short>
#   - push of a tag v*         → tag :latest, :<tag>, :sha-<short>
#   - pull_request             → build only, no push (Dockerfile smoke-test)
#   - manual dispatch          → optional custom TAG override

on:
    push:
        branches: [main]
        tags: ['v*']
        paths-ignore:
            - '**/*.md'
            - 'docs/**'
            - '.github/workflows/ci.yml'
    pull_request:
        branches: [main]
        paths-ignore:
            - '**/*.md'
            - 'docs/**'
    workflow_dispatch:
        inputs:
            tag:
                description: 'Image tag to publish (e.g. v1.2.3)'
                required: false
                default: ''

concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

env:
    REGISTRY: ghcr.io
    # GHCR namespace = repo owner lowercased. Resolved per-job below.

jobs:
    build:
        name: ${{ matrix.service }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        strategy:
            fail-fast: false
            matrix:
                include:
                    - { service: ms-gateway-api,        context: ms-gateway-api,        target: prod }
                    - { service: ms-user-api,           context: ms-user-api,           target: prod }
                    - { service: ms-authentication-api, context: ms-authentication-api, target: prod }
                    - { service: ms-sftp-api,           context: ms-sftp-api,           target: prod }
                    - { service: ms-logs-api,           context: ms-logs-api,           target: '' }
                    # ms-logs-ui's Dockerfile does `COPY ui/…`, so it must build
                    # from the ms-logs-api parent context, not from ms-logs-api/ui.
                    - { service: ms-logs-ui,            context: ms-logs-api, file: ms-logs-api/ui/Dockerfile, target: '' }
                    - { service: ms-hydro-api,          context: ms-hydro-api,          target: prod }
                    - { service: ms-predictions-api,    context: ms-predictions-api,    target: prod }
                    - { service: ms-model-api,          context: ms-model-api,          target: prod }
                    - { service: ms-notifications-api,  context: ms-notifications-api,  target: prod }
                    - { service: ms-meteo-api,          context: ms-meteo-api,          target: prod }
                    - { service: vsad-tajo-frontend,    context: vsad-tajo-frontend,    target: prod, frontend: true }

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set image namespace (lowercase owner)
              id: ns
              run: echo "ns=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GHCR
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Compute tags
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ steps.ns.outputs.ns }}/${{ matrix.service }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=sha,prefix=sha-,format=short
                      type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') || startsWith(github.ref, 'refs/tags/v') }}
                      type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}

            - name: Build & push (${{ matrix.service }})
              uses: docker/build-push-action@v6
              with:
                  context: ./${{ matrix.context }}
                  file: ${{ matrix.file && format('./{0}', matrix.file) || format('./{0}/Dockerfile', matrix.context) }}
                  target: ${{ matrix.target }}
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.service }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.service }}
                  build-args: |
                      ${{ matrix.frontend && format('VITE_API_URL={0}', vars.VITE_API_URL) || '' }}
                      ${{ matrix.frontend && format('VITE_GEOSERVER_URL={0}', vars.VITE_GEOSERVER_URL) || '' }}

    summary:
        name: Build summary
        needs: build
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Recap
              run: |
                  echo "### Image build" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "Registry: \`ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')\`" >> "$GITHUB_STEP_SUMMARY"
                  echo "Ref:      \`${{ github.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
                  echo "SHA:      \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
                  if [ "${{ needs.build.result }}" = "success" ]; then
                      echo "Result:   ✅ all services built" >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "Result:   ❌ at least one service failed" >> "$GITHUB_STEP_SUMMARY"
                      exit 1
                  fi
