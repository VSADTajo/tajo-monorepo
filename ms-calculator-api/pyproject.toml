[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-calculator-api"
version = "0.1.0"
description = "Volume-balance calculator microservice — event-driven FastAPI + aio-pika"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aio-pika>=9.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "pandas>=2.0",
    "pytz>=2024.1",
    "gunicorn>=22",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "testcontainers[rabbitmq]>=4.8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored verbatim from VSADTajo/tajo-volume_calculator — keep byte-identical
# to upstream, so it is not linted (mypy already excludes it below).
extend-exclude = ["src/domain/volume_calculator/"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["src/domain/volume_calculator/", ".venv/"]

[[tool.mypy.overrides]]
module = ["pandas.*", "aio_pika.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
log_cli = false
