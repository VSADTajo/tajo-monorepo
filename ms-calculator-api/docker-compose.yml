services:
  app:
    container_name: ms-calculator-api
    image: ms-calculator-api-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: local
      RABBITMQ_HOST: infra-rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      APP_PORT: '3011'
      APP_LOG_LEVEL: info
    volumes:
      - .:/app
    networks:
      - app-network
      - infra-network
    ports:
      - '3011:3011'
    command: uvicorn src.main:app --host 0.0.0.0 --port 3011 --reload

networks:
  app-network:
  infra-network:
    external: true
    name: infra-network
