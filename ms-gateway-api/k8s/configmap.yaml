apiVersion: v1
kind: ConfigMap
metadata:
    name: auth-3ds-api-config
    namespace: NAMESPACE
    labels:
        app: auth-3ds-api
data:
    APP_NAME: auth-3ds-api
    NODE_ENV: production
    APP_URL: '0.0.0.0'
    APP_PORT: '3000'
    APP_LOG_LEVEL: info
    REDIS_HOST: host.docker.internal
    REDIS_PORT: '6379'
    REDIS_DEFAULT_TTL: '300'
    RABBITMQ_ENABLED: 'true'
    RABBITMQ_HOST: host.docker.internal
    RABBITMQ_PORT: '5672'
    RABBITMQ_USER: guest
    RABBITMQ_PASSWORD: guest
    RABBITMQ_VHOST: /
    RABBITMQ_PREFETCH: '10'
    RABBITMQ_RETRY_ATTEMPTS: '3'
    RABBITMQ_RETRY_DELAY: '5000'
