apiVersion: v1
kind: Service
metadata:
    name: auth-3ds-api
    namespace: NAMESPACE
    labels:
        app: auth-3ds-api
spec:
    type: NodePort
    selector:
        app: auth-3ds-api
    ports:
        - name: http
          protocol: TCP
          port: 3000
          targetPort: 3000
          nodePort: 30000
