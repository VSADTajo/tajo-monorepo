apiVersion: apps/v1
kind: Deployment
metadata:
    name: auth-3ds-api
    namespace: NAMESPACE
    labels:
        app: auth-3ds-api
spec:
    replicas: 2
    selector:
        matchLabels:
            app: auth-3ds-api
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
    template:
        metadata:
            labels:
                app: auth-3ds-api
        spec:
            containers:
                - name: auth-3ds-api
                  image: DOCKER_IMAGE:IMAGE_TAG
                  ports:
                      - containerPort: 3000
                        protocol: TCP
                  envFrom:
                      - configMapRef:
                            name: auth-3ds-api-config
                  resources:
                      requests:
                          memory: '256Mi'
                          cpu: '250m'
                      limits:
                          memory: '512Mi'
                          cpu: '500m'
                  livenessProbe:
                      httpGet:
                          path: /api/health
                          port: 3000
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      timeoutSeconds: 5
                  readinessProbe:
                      httpGet:
                          path: /api/health
                          port: 3000
                      initialDelaySeconds: 15
                      periodSeconds: 5
                      timeoutSeconds: 3
            restartPolicy: Always
