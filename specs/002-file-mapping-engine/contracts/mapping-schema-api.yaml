openapi: 3.0.3
info:
  title: File Mapping Engine API
  version: 1.0.0
  description: API contracts for the file mapping engine feature

paths:
  /mapping-schemas:
    post:
      summary: Create a new mapping schema
      operationId: createMappingSchema
      tags: [MappingSchemas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMappingSchemaRequest'
      responses:
        '201':
          description: Schema created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingSchemaResponse'
        '400':
          description: Validation error (invalid field mappings, missing fields)
        '409':
          description: Schema already exists for this directory path

    get:
      summary: List all mapping schemas
      operationId: listMappingSchemas
      tags: [MappingSchemas]
      responses:
        '200':
          description: List of all mapping schemas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMappingSchemasResponse'

  /mapping-schemas/{id}:
    get:
      summary: Get mapping schema by ID
      operationId: getMappingSchemaById
      tags: [MappingSchemas]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Schema details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingSchemaResponse'
        '404':
          description: Schema not found

    put:
      summary: Update an existing mapping schema
      operationId: updateMappingSchema
      tags: [MappingSchemas]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMappingSchemaRequest'
      responses:
        '200':
          description: Schema updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingSchemaResponse'
        '400':
          description: Validation error
        '404':
          description: Schema not found
        '409':
          description: Directory path conflict with another schema

    delete:
      summary: Delete a mapping schema
      operationId: deleteMappingSchema
      tags: [MappingSchemas]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Schema deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMappingSchemaResponse'
        '404':
          description: Schema not found

  /mapping-schemas/{id}/toggle:
    patch:
      summary: Toggle mapping schema active/inactive
      operationId: toggleMappingSchema
      tags: [MappingSchemas]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleMappingSchemaRequest'
      responses:
        '200':
          description: Schema toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingSchemaResponse'
        '404':
          description: Schema not found

  /sftp/download:
    post:
      summary: Download file from SFTP (existing endpoint, extended with mapping)
      description: |
        If an active mapping schema exists for the file's directory path,
        the file is transformed according to the schema before being served.
        If no active schema exists, the raw file is returned as-is.
      operationId: sftpDownloadFile
      tags: [SFTP]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SftpDownloadFileRequest'
      responses:
        '200':
          description: File stream (raw or transformed)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Transformation error (format mismatch, schema error)
        '401':
          description: Invalid SFTP credentials
        '404':
          description: File not found

components:
  schemas:
    FieldMapping:
      type: object
      required: [sourceField, targetField]
      properties:
        sourceField:
          type: string
          description: Source field path (XPath for XML, column name/index for CSV)
          example: 'series.header.locationId'
        targetField:
          type: string
          description: Target field name in output
          example: 'location_id'
        dataType:
          type: string
          enum: [string, number, date, boolean]
          default: string
        defaultValue:
          type: string
          description: Default value when source is missing
        transform:
          type: string
          description: Transformation rule (lowercase, uppercase, trim, dateFormat:YYYY-MM-DD)
          example: 'lowercase'

    CsvOptions:
      type: object
      properties:
        delimiter:
          type: string
          default: ';'
          example: ';'
        encoding:
          type: string
          default: 'utf-8'
        metadataRows:
          type: integer
          default: 0
          description: Number of metadata/header rows to skip
          example: 15
        outputDelimiter:
          type: string
          default: ','
        includeHeader:
          type: boolean
          default: true

    CreateMappingSchemaRequest:
      type: object
      required: [directoryPath, name, inputFormat, outputFormat, fieldMappings]
      properties:
        directoryPath:
          type: string
          example: '/forecast/NAM/'
        name:
          type: string
          example: 'NAM Forecast EPS Stats'
        inputFormat:
          type: string
          enum: [xml, csv]
        outputFormat:
          type: string
          enum: [json, csv, dat, parquet]
        fieldMappings:
          type: array
          items:
            $ref: '#/components/schemas/FieldMapping'
          minItems: 1
        csvOptions:
          $ref: '#/components/schemas/CsvOptions'

    UpdateMappingSchemaRequest:
      type: object
      properties:
        directoryPath:
          type: string
        name:
          type: string
        inputFormat:
          type: string
          enum: [xml, csv]
        outputFormat:
          type: string
          enum: [json, csv, dat, parquet]
        fieldMappings:
          type: array
          items:
            $ref: '#/components/schemas/FieldMapping'
          minItems: 1
        csvOptions:
          $ref: '#/components/schemas/CsvOptions'

    ToggleMappingSchemaRequest:
      type: object
      required: [isActive]
      properties:
        isActive:
          type: boolean

    MappingSchemaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        directoryPath:
          type: string
        name:
          type: string
        inputFormat:
          type: string
        outputFormat:
          type: string
        isActive:
          type: boolean
        fieldMappings:
          type: array
          items:
            $ref: '#/components/schemas/FieldMapping'
        csvOptions:
          $ref: '#/components/schemas/CsvOptions'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ListMappingSchemasResponse:
      type: object
      properties:
        schemas:
          type: array
          items:
            $ref: '#/components/schemas/MappingSchemaResponse'

    DeleteMappingSchemaResponse:
      type: object
      properties:
        deletedId:
          type: string
          format: uuid
        directoryPath:
          type: string

    SftpDownloadFileRequest:
      type: object
      required: [connection, path]
      properties:
        connection:
          type: object
          required: [host, username]
          properties:
            host:
              type: string
            port:
              type: integer
              default: 22
            username:
              type: string
            password:
              type: string
            privateKey:
              type: string
        path:
          type: string
          description: Full remote file path (directory extracted for schema lookup)
